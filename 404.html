<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="رهجو؛ زیرساخت یکپارچهٔ مدیریت مشتری، فروش و ارائهٔ خدمات از اولین تماس تا تحویل نتیجه." />
    <meta name="theme-color" content="#0b1d33" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <base id="app-base" href="/" />
    <script>
      (() => {
        const host = window.location.hostname;
        const path = window.location.pathname;
        const base = document.querySelector("#app-base");
        if (!base) return;
        if (host.endsWith("github.io")) {
          const project = path.split("/").filter(Boolean)[0];
          base.href = project ? `/${project}/` : "/";
        } else if (host === "raw.githack.com" || host === "rawgit.com") {
          base.href = path.slice(0, path.lastIndexOf("/") + 1);
        }
      })();
    </script>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/assets/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
