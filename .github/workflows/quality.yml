name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install development tools
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Type check and tests
        run: npm run qa
