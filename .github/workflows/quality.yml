name: Quality
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run qa
      - run: npm run build:hostinger
      - run: npm run smoke:hostinger
      - uses: actions/upload-artifact@v4
        with:
          name: rahjo-hostinger-preview
          path: dist-hostinger
          if-no-files-found: error
          retention-days: 14
