name: CRM Core — Public + Console QA

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "src/app/**"
      - "src/features/public/**"
      - "src/features/auth/**"
      - "src/features/requests/**"
      - "src/features/operations/**"
      - "styles/**"
      - "scripts/public-site-qa.mjs"
      - "scripts/console-qa.mjs"
      - "scripts/build-hostinger.mjs"
      - "index.html"
      - "tests/**"
      - ".github/workflows/public-site-qa.yml"

permissions:
  contents: read

jobs:
  public-site-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci --ignore-scripts

      - name: Run code and contract QA
        run: npm run qa

      - name: Build and smoke Hostinger package
        run: |
          npm run build:hostinger
          npm run smoke:hostinger

      - name: Install Chromium for rendered QA
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local CRM Core server
        run: |
          node scripts/serve.mjs > /tmp/crm-core-public-server.log 2>&1 &
          echo $! > /tmp/crm-core-public-server.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/crm-core-public-server.log
          exit 1

      - name: Render desktop and mobile public pages
        run: node scripts/public-site-qa.mjs

      - name: Render desktop and mobile console surfaces
        run: node scripts/console-qa.mjs

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm-core-public-console-qa
          path: |
            qa-artifacts/public-site
            qa-artifacts/console
            /tmp/crm-core-public-server.log
          if-no-files-found: warn
          retention-days: 14
