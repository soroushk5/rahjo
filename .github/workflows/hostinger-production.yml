name: Publish Hostinger Production Branch + Verify Live

on:
  workflow_run:
    workflows: ["Quality"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require the production origin
        env:
          SITE_ORIGIN: ${{ vars.CRM_PRODUCTION_ORIGIN || vars.RAHJO_PRODUCTION_ORIGIN }}
        run: test -n "$SITE_ORIGIN"
      - name: Build and verify production public files
        env:
          DEPLOY_MODE: production
          SITE_ORIGIN: ${{ vars.CRM_PRODUCTION_ORIGIN || vars.RAHJO_PRODUCTION_ORIGIN }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          CRM_RUNTIME_MODE: ${{ vars.CRM_RUNTIME_MODE || vars.RAHJO_RUNTIME_MODE }}
          CRM_API_BASE: ${{ vars.CRM_API_BASE || vars.RAHJO_API_BASE }}
        run: |
          node scripts/build-hostinger.mjs
          node scripts/smoke-hostinger.mjs
      - name: Verify tracked CRM API deployment reached this contract
        env:
          API_BASE: ${{ vars.CRM_API_BASE || vars.RAHJO_API_BASE }}
        run: |
          set -euo pipefail
          api="${API_BASE%/}"
          test -n "$api"
          for attempt in $(seq 1 24); do
            health="$(curl --fail --silent --show-error --location               --connect-timeout 10 --max-time 20               -H 'Cache-Control: no-cache' -H 'Pragma: no-cache'               "$api/healthz?contract=2&attempt=$attempt" || true)"
            if HEALTH="$health" node --input-type=module -e '
              const health = JSON.parse(process.env.HEALTH || "{}");
              if (health.service === "crm-core-bff" && Number(health.contractVersion) >= 2) process.exit(0);
              process.exit(1);
            '; then
              echo "Live CRM API contract v2 verified."
              break
            fi
            if [ "$attempt" = 24 ]; then
              echo "::error::Hostinger Node Web App has not converged to CRM API contract v2."
              exit 1
            fi
            sleep 10
          done

      - name: Verify live API rate limiting contract
        env:
          API_BASE: ${{ vars.CRM_API_BASE || vars.RAHJO_API_BASE }}
          SITE_ORIGIN: ${{ vars.CRM_PRODUCTION_ORIGIN || vars.RAHJO_PRODUCTION_ORIGIN }}
        run: |
          set -euo pipefail
          api="${API_BASE%/}"
          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT
          got_429=0
          for attempt in $(seq 1 12); do
            code="$(curl --silent --show-error --location               --connect-timeout 10 --max-time 20               -D "$headers" -o "$body" -w '%{http_code}'               -X POST "$api/api/v1/session"               -H "Origin: $SITE_ORIGIN"               -H 'Content-Type: application/json'               --data '{"workspaceSlug":"rate-limit-probe","email":"probe@example.invalid","password":"invalid-password"}')"
            if [ "$code" = 429 ]; then
              got_429=1
              break
            fi
            test "$code" = 401
          done
          test "$got_429" = 1
          grep -qi '^retry-after:' "$headers"
          BODY="$(cat "$body")" node --input-type=module -e '
            const body = JSON.parse(process.env.BODY || "{}");
            if (body.code !== "RATE_LIMITED") process.exit(1);
          '
          echo "Live 429 + Retry-After contract verified."

      - name: Verify live public intake idempotency
        env:
          API_BASE: ${{ vars.CRM_API_BASE || vars.RAHJO_API_BASE }}
          SITE_ORIGIN: ${{ vars.CRM_PRODUCTION_ORIGIN || vars.RAHJO_PRODUCTION_ORIGIN }}
        run: |
          set -euo pipefail
          api="${API_BASE%/}"
          key="crm-core-live-acceptance-v1"
          payload='{"organization":"CRM Core Acceptance Probe","contactName":"CI Acceptance","email":"crm-core-acceptance@example.test","purpose":"Automated live public-intake acceptance; safe to ignore."}'
          first="$(mktemp)"
          second="$(mktemp)"
          trap 'rm -f "$first" "$second"' EXIT
          first_code="$(curl --silent --show-error --location             --connect-timeout 10 --max-time 20             -o "$first" -w '%{http_code}'             -X POST "$api/api/v1/public/intakes"             -H "Origin: $SITE_ORIGIN"             -H 'Content-Type: application/json'             -H "Idempotency-Key: $key"             --data "$payload")"
          case "$first_code" in 200|201) ;; *) cat "$first"; exit 1 ;; esac
          second_code="$(curl --silent --show-error --location             --connect-timeout 10 --max-time 20             -o "$second" -w '%{http_code}'             -X POST "$api/api/v1/public/intakes"             -H "Origin: $SITE_ORIGIN"             -H 'Content-Type: application/json'             -H "Idempotency-Key: $key"             --data "$payload")"
          test "$second_code" = 200
          FIRST="$(cat "$first")" SECOND="$(cat "$second")" node --input-type=module -e '
            const first = JSON.parse(process.env.FIRST || "{}");
            const second = JSON.parse(process.env.SECOND || "{}");
            if (first.status !== "received" || second.status !== "received" || second.replayed !== true) process.exit(1);
          '
          echo "Live public intake + idempotent replay verified."

      - name: Publish generated branch without rewriting history
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          TARGET_BRANCH: hostinger-production
        run: |
          publish_dir="$(mktemp -d)"
          cd "$publish_dir"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH"; then
            git fetch --depth=1 origin "$TARGET_BRANCH"
            git checkout -b "$TARGET_BRANCH" FETCH_HEAD
            git rm -rf .
          else
            git checkout --orphan "$TARGET_BRANCH"
          fi
          cp -a "$GITHUB_WORKSPACE/dist-hostinger/." .
          git add -A
          if git diff --cached --quiet; then
            echo "Generated production branch is already current."
          else
            git commit -m "deploy: Hostinger production ${SOURCE_SHA::7}"
            git push origin "$TARGET_BRANCH"
          fi
      - name: Verify the public Hostinger origin actually deployed this source SHA
        env:
          SITE_ORIGIN: ${{ vars.CRM_PRODUCTION_ORIGIN || vars.RAHJO_PRODUCTION_ORIGIN }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          origin="${SITE_ORIGIN%/}"
          for attempt in $(seq 1 24); do
            cache_bust="${SOURCE_SHA}-${GITHUB_RUN_ID}-${attempt}"
            health="$(curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 20 \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "${origin}/health.json?deploy=${cache_bust}" || true)"
            if HEALTH="$health" SOURCE_SHA="$SOURCE_SHA" node --input-type=module -e '
              const health = JSON.parse(process.env.HEALTH || "{}");
              const expected = process.env.SOURCE_SHA;
              if (health.buildSha === expected || health.commit === expected) process.exit(0);
              process.exit(1);
            '; then
              echo "Live Hostinger origin verified at ${SOURCE_SHA}."
              exit 0
            fi
            echo "Live origin has not converged to ${SOURCE_SHA} yet (attempt ${attempt}/24)."
            sleep 10
          done
          echo "::error::Generated branch was published, but the live Hostinger origin does not report source SHA ${SOURCE_SHA}. Check hPanel Git deployment branch=hostinger-production and Auto Deployment/webhook configuration."
          exit 1
