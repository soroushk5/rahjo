name: Publish Hostinger Production Branch

on:
  workflow_run:
    workflows: ["Quality"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require the production origin
        env:
          SITE_ORIGIN: ${{ vars.RAHJO_PRODUCTION_ORIGIN }}
        run: test -n "$SITE_ORIGIN"
      - name: Build and verify production public files
        env:
          DEPLOY_MODE: production
          SITE_ORIGIN: ${{ vars.RAHJO_PRODUCTION_ORIGIN }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          node scripts/build-hostinger.mjs
          node scripts/smoke-hostinger.mjs
      - name: Publish generated branch without rewriting history
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          TARGET_BRANCH: hostinger-production
        run: |
          publish_dir="$(mktemp -d)"
          cd "$publish_dir"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH"; then
            git fetch --depth=1 origin "$TARGET_BRANCH"
            git checkout -b "$TARGET_BRANCH" FETCH_HEAD
            git rm -rf .
          else
            git checkout --orphan "$TARGET_BRANCH"
          fi
          cp -a "$GITHUB_WORKSPACE/dist-hostinger/." .
          git add -A
          if git diff --cached --quiet; then
            echo "Generated production branch is already current."
            exit 0
          fi
          git commit -m "deploy: Hostinger production ${SOURCE_SHA::7}"
          git push origin "$TARGET_BRANCH"
