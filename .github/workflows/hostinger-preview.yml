name: Publish Hostinger Preview Branch

on:
  workflow_run:
    workflows: ["Quality"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build preview-only public files
        env:
          DEPLOY_MODE: preview
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/build-hostinger.mjs
      - name: Publish generated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist-hostinger
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: Hostinger preview ${GITHUB_SHA::7}"
          git branch -M hostinger-preview
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin hostinger-preview
