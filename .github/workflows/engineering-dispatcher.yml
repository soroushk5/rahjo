name: Engineering Dispatch Queue Preflight

on:
  issues:
    types: [opened, edited, reopened]
  pull_request:
    paths:
      - '.github/engineering-dispatch/**'
      - '.github/workflows/engineering-dispatcher.yml'

permissions:
  contents: read
  issues: read

concurrency:
  group: engineering-dispatch-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s .github/engineering-dispatch -p test_engineering_dispatcher.py -q

  preflight:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[READY_FOR_AGENT]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate owner-authored dispatch contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .dispatcher
          python .github/engineering-dispatch/engineering_dispatcher.py preflight \
            --event "$GITHUB_EVENT_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --output .dispatcher/preflight.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('.dispatcher/preflight.json').read_text(encoding='utf-8'))
          if result.get('status') != 'READY':
              raise SystemExit('dispatcher preflight was not READY')
          print('Queue contract validated. Local authenticated Codex execution requires separate runner acceptance.')
          PY
