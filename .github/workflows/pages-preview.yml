name: Deploy GitHub Pages Preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install QA dependency
        run: npm install --ignore-scripts

      - name: Run QA
        run: npm run qa

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build static preview
        env:
          COMMIT_SHA: ${{ github.sha }}
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build:hostinger

      - name: Prepare Pages artifact
        run: |
          rm -f dist-hostinger/.htaccess
          cp dist-hostinger/index.html dist-hostinger/404.html
          touch dist-hostinger/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-hostinger

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
