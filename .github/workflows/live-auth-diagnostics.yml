name: Live Auth Diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/live-auth-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-login-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FRONTEND_ORIGIN: https://linen-crocodile-733177.hostingersite.com
      BACKEND_ORIGIN: https://paleturquoise-dogfish-211679.hostingersite.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser probe
        run: |
          npm ci --ignore-scripts
          npm install --no-save --ignore-scripts playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Verify live failed-login UX
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const frontend = process.env.FRONTEND_ORIGIN;
          const backend = process.env.BACKEND_ORIGIN;
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ locale: 'fa-IR' });
          const page = await context.newPage();
          const failed = [];
          page.on('requestfailed', (request) => failed.push(`${request.method()} ${request.url()} :: ${request.failure()?.errorText}`));
          await page.goto(`${frontend}/login`, { waitUntil: 'domcontentloaded', timeout: 30000 });
          await page.waitForSelector('#rahjo-server-login', { state: 'visible', timeout: 15000 });
          await page.locator('input[name="workspaceSlug"]').fill('rahjo');
          await page.locator('input[name="email"]').fill('owner@rahjo.local');
          await page.locator('input[name="password"]').fill('definitely-wrong-live-diagnostic-browser');
          const responsePromise = page.waitForResponse((r) => r.url() === `${backend}/api/v1/session` && r.request().method() === 'POST', { timeout: 15000 });
          await page.locator('#rahjo-server-login button[type="submit"]').click();
          const response = await responsePromise;
          if (response.status() !== 401) throw new Error(`Expected 401 from invalid credentials; got ${response.status()}`);
          await page.waitForFunction(() => document.querySelector('#rahjo-login-feedback')?.textContent?.trim().length > 0, null, { timeout: 5000 });
          const feedback = (await page.locator('#rahjo-login-feedback').textContent())?.trim();
          const workspace = await page.locator('input[name="workspaceSlug"]').inputValue();
          const email = await page.locator('input[name="email"]').inputValue();
          const password = await page.locator('input[name="password"]').inputValue();
          const focusedName = await page.evaluate(() => document.activeElement?.getAttribute('name'));
          const buttonDisabled = await page.locator('#rahjo-server-login button[type="submit"]').isDisabled();
          console.log(JSON.stringify({ feedback, workspace, email, passwordEmpty: password === '', focusedName, buttonDisabled, failed }, null, 2));
          if (feedback !== 'اطلاعات ورود یا فضای کاری درست نیست.') throw new Error(`Unexpected feedback: ${feedback}`);
          if (workspace !== 'rahjo' || email !== 'owner@rahjo.local') throw new Error('Submitted identity fields were not preserved');
          if (password !== '') throw new Error('Password was not cleared');
          if (focusedName !== 'password') throw new Error('Password field did not regain focus');
          if (buttonDisabled) throw new Error('Submit button stayed disabled');
          if (failed.length) throw new Error(`Network request failures: ${failed.join(' | ')}`);
          await browser.close();
          NODE
